[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metaclean-cli"
version = "0.1.0"
description = "Inspect and remove metadata from images and PDFs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "pypdf>=4"]

[project.scripts]
metaclean = "metaclean.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
